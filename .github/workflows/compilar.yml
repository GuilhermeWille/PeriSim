# Compila e testa o Perícia Sim no Linux, no Windows e no macOS.
# Em uma tag "v*" (ex.: v0.9.1), publica os pacotes das três plataformas como Release.
name: Compilar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    name: ${{ matrix.nome }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # glibc 2.35: o binário roda em Ubuntu 22.04+, Arch, Fedora atuais
            nome: linux-x86_64
          - os: windows-latest
            nome: windows-x86_64
          - os: macos-latest
            nome: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev

      - name: Testes
        run: cargo test --workspace --release --locked

      - name: Compilar (Linux / Windows)
        if: runner.os != 'macOS'
        run: cargo build --release --locked -p pericia_app

      - name: Compilar (macOS universal — Apple Silicon + Intel)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked -p pericia_app --target aarch64-apple-darwin
          cargo build --release --locked -p pericia_app --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/pericia-sim \
            target/aarch64-apple-darwin/release/pericia-sim \
            target/x86_64-apple-darwin/release/pericia-sim

      - name: Empacotar
        shell: bash
        run: packaging/ci/empacotar.sh "${{ matrix.nome }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pericia-sim-${{ matrix.nome }}
          path: |
            dist-ci/*.zip
            dist-ci/*.tar.gz

  publicar:
    needs: compilar
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacotes
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: pacotes/*
          generate_release_notes: true
