# Compila e testa o Perícia Sim no Linux, no Windows e no macOS.
# A cada push na main (ou tag "v*"), publica — ou atualiza — a Release "v<versão do Cargo.toml>"
# com os pacotes das três plataformas.
name: Compilar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    name: ${{ matrix.nome }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # glibc 2.35: o binário roda em Ubuntu 22.04+, Arch, Fedora atuais
            nome: linux-x86_64
          - os: windows-latest
            nome: windows-x86_64
          - os: macos-latest
            nome: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev

      - name: Testes
        run: cargo test --workspace --release --locked

      - name: Compilar (Linux / Windows)
        if: runner.os != 'macOS'
        run: cargo build --release --locked -p pericia_app

      - name: Compilar (macOS universal — Apple Silicon + Intel)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked -p pericia_app --target aarch64-apple-darwin
          cargo build --release --locked -p pericia_app --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/pericia-sim \
            target/aarch64-apple-darwin/release/pericia-sim \
            target/x86_64-apple-darwin/release/pericia-sim

      - name: Empacotar
        shell: bash
        run: packaging/ci/empacotar.sh "${{ matrix.nome }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pericia-sim-${{ matrix.nome }}
          path: |
            dist-ci/*.zip
            dist-ci/*.tar.gz

  publicar:
    needs: compilar
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versão
        id: versao
        run: echo "tag=v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: pacotes
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          name: PeriSim ${{ steps.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: pacotes/*
          overwrite_files: true
          make_latest: true
          generate_release_notes: true
