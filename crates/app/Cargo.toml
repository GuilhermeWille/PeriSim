[package]
name = "pericia_app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Interface 3D/2D do simulador de informática forense."

[[bin]]
name = "pericia-sim"
path = "src/main.rs"

[dependencies]
pericia_core = { path = "../core" }
macroquad = { version = "0.4.16", default-features = false }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Saída de som no Windows (WASAPI) e no macOS (CoreAudio); no Linux o jogo usa ALSA por dlopen.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
cpal = "0.18"
